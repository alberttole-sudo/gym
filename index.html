<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym y Dieta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url("instrument-serif-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url("instrument-serif-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url("instrument-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url("instrument-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url("instrument-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:700;font-display:swap;src:url("instrument-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:400;font-display:swap;src:url("source-serif-4-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:500;font-display:swap;src:url("source-serif-4-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:600;font-display:swap;src:url("source-serif-4-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:700;font-display:swap;src:url("source-serif-4-latin-700-normal.woff2") format("woff2")}
/* Layout: una columna tipo app móvil con cabecera marina; gym y dieta en pestañas, barra fija abajo */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --ink:#0F1E3D; --muted:#6B7590; --line:#E2E6EE;
  --accent:#1B2F5E; --accent-ink:#F6F1E6; --accent-soft:#E7EBF4; --gold:#A8854A; --warn:#A4472A; --warn-soft:#F6E9E2;
  --ok:#3E7C5F; --ok-soft:#E1EEE7; --del:#9E2F45; --shadow:0 8px 28px rgba(15,30,61,.12);
  --bar-bg:#0F1E3D; --bar-ink:#9AA6C2; --bar-active:#E4CB94; --today-bg:#DDB86C; --today-ink:#0F1E3D; --perfect:#F3E7CC;
  --hero-bg:#0F1E3D; --hero-ink:#F6F1E6; --hero-muted:#9AA6C2; --hero-gold:#D2B67E; --ring-track:#2A3A62;
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09111F; --surface:#101B31; --ink:#EEEAE0; --muted:#8C96AE; --line:#1E2A45;
  --accent:#D2B67E; --accent-ink:#09111F; --accent-soft:#1B2844; --gold:#D2B67E; --warn:#E39A72; --warn-soft:#33221B;
  --ok:#74B796; --ok-soft:#16302A; --del:#E5788C; --shadow:0 8px 28px rgba(0,0,0,.45);
  --bar-bg:#0C1628; --bar-ink:#7D88A3; --bar-active:#D2B67E; --today-bg:#E8C57F; --today-ink:#09111F; --perfect:#3A3220; --hero-bg:#15254A; --hero-ink:#F1ECE1; --hero-muted:#9AA6C2; --hero-gold:#D2B67E; --ring-track:#2B3C66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09111F; --surface:#101B31; --ink:#EEEAE0; --muted:#8C96AE; --line:#1E2A45;
  --accent:#D2B67E; --accent-ink:#09111F; --accent-soft:#1B2844; --gold:#D2B67E; --warn:#E39A72; --warn-soft:#33221B;
  --ok:#74B796; --ok-soft:#16302A; --del:#E5788C; --shadow:0 8px 28px rgba(0,0,0,.45);
  --bar-bg:#0C1628; --bar-ink:#7D88A3; --bar-active:#D2B67E; --today-bg:#E8C57F; --today-ink:#09111F; --perfect:#3A3220; --hero-bg:#15254A; --hero-ink:#F1ECE1; --hero-muted:#9AA6C2; --hero-gold:#D2B67E; --ring-track:#2B3C66; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}

/* Cabeceras */
.eyebrow{font-family:var(--f-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.phead{display:flex;align-items:flex-end;gap:8px}
.phead .tt{flex:1;min-width:0}
.hday{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1.02;letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
.hday em{font-style:italic;color:var(--gold)}
.hsub{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:6px}
.icbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icbtn svg{width:20px;height:20px}
.icbtn[hidden]{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;font-family:var(--f-ui)}
.rule{height:1px;background:var(--line);margin:14px 0 0;position:relative}
.rule::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;background:var(--gold)}
.progress{display:flex;align-items:center;gap:12px;margin-top:14px;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}
.section-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 10px;font-family:var(--f-ui);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.section-t small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

/* Tarjeta de rutina */
.list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.rt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 12px;transition:border-color .2s}
.rt.done{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.rt.rest{opacity:.72}
.rt .ic{flex:none;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);display:grid;place-items:center;transition:background .2s,color .2s}
.rt .ic svg{width:22px;height:22px}
.rt.done .ic{background:var(--c);color:#fff}
.rt .tx{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.rt .tx b{display:block;font-weight:500;font-size:16.5px;overflow-wrap:anywhere}
.rt .tx span{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:2px}
.flame{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.flame svg{width:14px;height:14px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c)}
.dots i.on{background:var(--c)}
.tag{font-family:var(--f-ui);background:var(--accent-soft);color:var(--accent);padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:600}
.chk{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;color:#fff;transition:background .2s}
.chk svg{width:22px;height:22px;opacity:0;transition:opacity .2s}
.rt.done .chk{background:var(--c)}
.rt.done .chk svg{opacity:1}
.chk.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.empty{text-align:center;color:var(--muted);padding:26px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:24px;margin-bottom:2px}
.tip{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:16px}
.banner.warn{background:var(--warn-soft)}
.banner .row{display:flex;gap:6px}
.banner button{font-family:var(--f-ui);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}

/* Calendarios */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal.wk{grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.9fr)}
.cal .wdh{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--ink);min-width:0;font-variant-numeric:tabular-nums}
.cd.out{background:none;color:var(--muted);opacity:.5}
.cd.fut{opacity:.4}
.cd.done{background:var(--c);color:#fff}
.cd.miss{background:none;border:1px dashed var(--line);color:var(--muted)}
.cd.today{outline:2px solid var(--today-bg);outline-offset:1px}
.cd.sel{border-color:var(--ink)}
.cd.perfect{background:var(--perfect)}
.cd .dd{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;padding:0 2px}
.cd .dd i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.wkc{display:grid;place-items:center;font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--muted);border-radius:9px;font-variant-numeric:tabular-nums}
.wkc.ok{background:var(--ok-soft);color:var(--ok)}
.wkc.ok svg{width:16px;height:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.legend i.pf{border-radius:3px;background:var(--perfect);border:1px solid var(--today-bg)}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mhead h3{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;text-transform:capitalize}

/* Detalle */
.back{font-family:var(--f-ui);display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.back svg{width:18px;height:18px}
.dhead{display:flex;align-items:center;gap:14px;margin-top:8px}
.dhead .ic{flex:none;width:58px;height:58px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.dhead .ic svg{width:28px;height:28px}
.dhead .hday{margin:0;font-size:38px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tiles small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.tiles b span{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-left:4px}
.tiles .hl{background:var(--accent);border-color:var(--accent)}
.tiles .hl small{color:var(--accent-ink);opacity:.75}
.tiles .hl b,.tiles .hl b span{color:var(--accent-ink)}

/* Rachas */
.rank{display:flex;flex-direction:column}
.rk{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left}
.rk:first-child{border-top:0;padding-top:0}
.rk:last-child{padding-bottom:0}
.rk .pos{flex:none;width:26px;font-family:var(--f-display);font-size:26px;line-height:1;color:var(--muted);text-align:center}
.rk:first-child .pos{color:var(--gold)}
.rk .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.rk .ic svg{width:17px;height:17px}
.rk .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .n small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);font-weight:400}
.rk .v{flex:none;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.rk .v span{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-left:3px}
.rate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.rate+.rate{margin-top:12px}
.rate .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rate .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate .pc{font-family:var(--f-ui);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.rate .meter{grid-column:2/4;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.rate .meter i{display:block;height:100%;background:var(--c);border-radius:99px}
.rate small{grid-column:2/4;font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.big3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.big3 small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big3 b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}

/* Ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.card h2{font-family:var(--f-display);font-size:24px;font-weight:400;margin:0 0 6px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--f-ui);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--del);border-color:color-mix(in srgb,var(--del) 40%,var(--line))}
.btn.danger.solid{background:var(--del);color:var(--surface);border-color:var(--del)}
.linkbtn{font-family:var(--f-ui);background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}
textarea.data{width:100%;min-height:110px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
ol.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
ol.steps b{color:var(--ink)}
.ordr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ordr:first-child{border-top:0;padding-top:0}
.ordr .ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.ordr .ic svg{width:15px;height:15px}
.ordr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordr .n small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.ordr button.mv{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.ordr button.mv svg{width:16px;height:16px}
.ordr button.mv[disabled]{opacity:.3}
.backup-when{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:10px}
.confirm{background:var(--warn-soft);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.confirm .row{margin-top:8px}

/* Barra inferior y botón */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--bar-ink)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--bar-active)}
.fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:16px;border:1px solid var(--gold);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:600;font-size:15px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}

/* Hoja */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,12,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:28px;font-weight:400;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field>.lbl{font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text]{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.err{font-family:var(--f-ui);color:var(--del);font-size:13px;margin:-6px 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:9px 4px;border-radius:9px;font-family:var(--f-ui);font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,30,61,.12)}
.seg input:focus-visible+label{outline:2px solid var(--gold)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

function seed(){
  const td = today(), ex = DEF_EX(), foods = DEF_FOODS();
  let s = 41; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  const it = (id, sets, reps, rest) => ({ex:id, sets, reps, rest});
  const routines = [
    {id:uid(), name:"Empuje", color:COLORS[0], ex:true, items:[it("press-banca",4,"6-8",150), it("press-inclinado-con-mancuernas",3,"8-10",120), it("press-militar",3,"8-10",120), it("elevaciones-laterales",3,"12-15",60), it("extension-en-polea",3,"10-12",60)]},
    {id:uid(), name:"Tirón", color:COLORS[5], ex:true, items:[it("dominadas",4,"6-8",150), it("remo-con-barra",3,"8-10",120), it("jalon-al-pecho",3,"10-12",90), it("face-pull",3,"12-15",60), it("curl-con-mancuernas",3,"10-12",60)]},
    {id:uid(), name:"Pierna", color:COLORS[2], ex:true, items:[it("sentadilla",4,"6-8",180), it("peso-muerto-rumano",3,"8-10",150), it("prensa",3,"10-12",120), it("curl-femoral",3,"10-12",60), it("elevacion-de-gemelos",4,"12-15",60), it("cinta",1,"20 min",0)]}
  ];
  const base = {"press-banca":62.5,"press-inclinado-con-mancuernas":22,"press-militar":37.5,"elevaciones-laterales":9,"extension-en-polea":22.5,"dominadas":0,"remo-con-barra":55,"jalon-al-pecho":50,"face-pull":17.5,"curl-con-mancuernas":12,"sentadilla":80,"peso-muerto-rumano":70,"prensa":140,"curl-femoral":35,"elevacion-de-gemelos":60};
  const workouts = [];
  const exById = id => ex.find(e => e.id === id);
  const startW = addDays(monday(td), -7*6);
  let k = 0;
  for (let w = 0; w < 7; w++) {
    [0,2,4].forEach((dd, j) => {
      const date = addDays(addDays(startW, w*7), dd + (rnd() < .25 ? 1 : 0));
      if (date >= td) return;
      const r = routines[(k++) % 3], prog = w*0.025;
      const t0 = parse(date).getTime() + (18*60 + Math.floor(rnd()*60))*60000;
      const items = r.items.map(x => {
        const e = exById(x.ex);
        if (e.type === "cardio") return {ex:e.id, name:e.name, type:"cardio", sets:[{min:20, km:Math.round((2.8+rnd()*.6)*10)/10, kcal:Math.round(200+rnd()*40), done:true}]};
        const top = parseInt(x.reps), b = base[e.id], allTop = e.id === "press-militar" || e.id === "curl-femoral";
        const wgt = b ? Math.round(b*(1+prog)/2.5)*2.5 : 0;
        return {ex:e.id, name:e.name, type:"fuerza", sets:Array.from({length:x.sets}, (_,i) => ({w:wgt, r:allTop ? parseInt(x.reps.split("-")[1]) : Math.max(4, top + 2 - i - Math.floor(rnd()*2)) + (b ? 0 : 3), done:true}))};
      });
      workouts.push({id:uid(), date, start:t0, end:t0 + (55+Math.floor(rnd()*20))*60000, routine:r.id, rname:r.name, items, ex:true});
    });
  }
  [[-4,"correr",32,5.6],[-11,"yoga",60,0],[-18,"correr",28,5],[-24,"clase",50,0]].forEach(([dd,a,mins,km]) => { const date = addDays(td,dd), t0 = parse(date).getTime()+9*3600000; workouts.push({id:uid(), kind:"act", act:a, date, start:t0, end:t0+mins*60000, rname:{correr:"Correr",yoga:"Yoga",clase:"Clase dirigida"}[a], items:[], km:km||undefined, ex:true}); });
  const body = []; for (let i = 42; i >= 0; i -= 3) body.push({date:addDays(td,-i), kg:Math.round((78.6 - (42-i)*0.035 + (rnd()-.5)*0.6)*10)/10, ex:true});
  const log = {};
  const fd = id => foods.find(f => f.id === id);
  const entry = (id, g) => { const f = fd(id); return {id:uid(), food:f.id, name:f.name, g, kcal:f.kcal*g/100, p:f.p*g/100, c:f.c*g/100, f:f.f*g/100}; };
  const dayPlan = () => ({
    Desayuno:[entry("copos-de-avena",50), entry("leche-semidesnatada",250), entry("platano",120)],
    Comida:[entry("arroz-blanco-cocido",200+Math.round(rnd()*80)), entry("pechuga-de-pollo-plancha",160), entry("brocoli",120), entry("aceite-de-oliva",10)],
    Merienda:[entry("skyr-yogur-proteico",150), entry("almendras",25)],
    Cena:[entry(rnd()<.5?"salmon":"merluza",150), entry("patata-cocida",200), entry("tomate",120), entry("aceite-de-oliva",10)],
    Snacks:rnd()<.4?[entry("chocolate-negro-70",20)]:[]
  });
  for (let i = 1; i <= 8; i++) log[addDays(td,-i)] = dayPlan();
  log[td] = {Desayuno:[entry("copos-de-avena",50), entry("leche-semidesnatada",250), entry("platano",120)], Comida:[entry("arroz-blanco-cocido",220), entry("pechuga-de-pollo-plancha",160), entry("brocoli",120), entry("aceite-de-oliva",10)], Merienda:[], Cena:[], Snacks:[]};
  const combos = [{id:uid(), name:"Desayuno de avena", items:[entry("copos-de-avena",50), entry("leche-semidesnatada",250), entry("platano",120)], ex:true}];
  return {v:1, v2:true, ex, foods, routines, workouts, active:null, log, combos, body, goals:{kcal:2400, p:150, c:270, f:75}, goalsEx:true, restDefault:90, weekGoal:3, since:Date.now()};
}

/* Temporizador de descanso */
let restTick = null;
function renderRest(){
  const root = document.getElementById("restRoot"), a = state.active;
  clearInterval(restTick);
  document.body.classList.toggle("resting", !!(a && a.rest && view === "gym"));
  if (!a || !a.rest || view !== "gym") { root.innerHTML = ""; return; }
  const draw = () => {
    const left = (a.rest.end - Date.now())/1000;
    if (left <= 0) { a.rest = null; save(); root.innerHTML = ""; document.body.classList.remove("resting"); clearInterval(restTick); buzz([200,100,200]); toast("¡Descanso terminado! A por la siguiente serie"); return; }
    const t = root.querySelector(".t"), g = root.querySelector(".grow i");
    if (t) { t.textContent = clock(left); g.style.width = (100 - left/a.rest.total*100)+"%"; }
  };
  root.innerHTML = '<div class="restbar2" role="timer" aria-live="off"><div><div class="lbl">Descanso</div><div class="t">'+clock((a.rest.end-Date.now())/1000)+'</div></div><div class="grow"><i style="width:0%"></i></div><button type="button" id="rMinus">−15</button><button type="button" id="rPlus">+15</button><button type="button" id="rSkip">Saltar</button></div>';
  document.getElementById("rMinus").addEventListener("click", () => { a.rest.end -= 15000; save(); draw(); });
  document.getElementById("rPlus").addEventListener("click", () => { a.rest.end += 15000; a.rest.total += 15; save(); draw(); });
  document.getElementById("rSkip").addEventListener("click", () => { a.rest = null; save(); renderRest(); });
  draw(); restTick = setInterval(draw, 250);
}
setInterval(() => { const el = document.getElementById("elapsed"); if (el && state.active) el.textContent = clock((Date.now()-state.active.start)/1000); }, 1000);

/* ---------- gráficos ---------- */
function niceMax(v){ if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart(pts, opt){
  if (pts.length < 2) return '<p class="hint" style="margin:0">Necesitas al menos dos registros para ver la gráfica.</p>';
  const W = 340, H = 170, L = 38, R = 10, T = 14, B = 22, ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad_ = Math.max((hi-lo)*.15, opt && opt.minPad || 1); lo = Math.max(0, lo - pad_); hi = hi + pad_;
  const step = niceMax((hi-lo)/3); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const x = i => L + (W-L-R) * (pts.length === 1 ? .5 : i/(pts.length-1)), y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo || 1));
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt && opt.label || "Gráfica")+'">';
  for (let v = lo; v <= hi + 1e-9; v += step) s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+n0(v)+'</text>';
  const d = pts.map((p,i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(" ");
  s += '<path class="ar" d="'+d+' L'+x(pts.length-1).toFixed(1)+' '+(H-B)+' L'+x(0).toFixed(1)+' '+(H-B)+' Z"/><path class="ln" d="'+d+'"/>';
  pts.forEach((p,i) => { if (pts.length <= 24 || i === pts.length-1) s += '<circle class="pt'+(i===pts.length-1?' last':'')+'" cx="'+x(i)+'" cy="'+y(p.y)+'" r="3.5"><title>'+shortDate(p.x)+': '+n1(p.y)+'</title></circle>'; });
  s += '<text x="'+L+'" y="'+(H-5)+'">'+shortDate(pts[0].x)+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+shortDate(pts[pts.length-1].x)+'</text>';
  const lp = pts[pts.length-1]; s += '<text class="val" x="'+Math.min(x(pts.length-1), W-R-4)+'" y="'+(y(lp.y)-9)+'" text-anchor="end">'+n1(lp.y)+'</text>';
  return s+'</svg>';
}

/* ---------- detalle de ejercicio ---------- */
function renderExercise(){
  const e = exOf(exDetail), hs = history(e.id);
  const pts = [], recs = [];
  let best = 0, bestSet = null, maxW = 0, totalSets = 0;
  hs.forEach(z => {
    const ds = doneSets(z.it); totalSets += ds.length;
    let top = 0; ds.forEach(x => { const v = e.type === "fuerza" ? e1rm(x.w, x.r) : e.type === "tiempo" ? (x.s||0) : (x.km || x.min || 0); if (v > top) top = v; if (e.type === "fuerza" && v > best) { best = v; bestSet = {x, date:z.w.date}; } if ((x.w||0) > maxW) maxW = x.w; if (x.pr) recs.push({x, date:z.w.date}); });
    if (top) pts.push({x:z.w.date, y:Math.round(top*10)/10});
  });
  const metric = e.type === "fuerza" ? (best ? "1RM estimado (kg)" : "Repeticiones") : e.type === "tiempo" ? "Segundos" : "Distancia (km) o minutos";
  if (e.type === "fuerza" && !best) { pts.length = 0; hs.forEach(z => { const top = Math.max(0, ...doneSets(z.it).map(x => x.r||0)); if (top) pts.push({x:z.w.date, y:top}); }); }
  let h = hero({
    left:'<button class="back" type="button" id="back">'+AL+' Volver</button>',

  h += '<div class="section-t"><span>Evolución</span><small>'+metric+'</small></div><div class="panel">'+lineChart(pts, {label:"Evolución de "+e.name})+'</div>';
  if (e.type === "fuerza" && best) h += '<p class="hint">El 1RM estimado es el peso que podrías levantar una sola vez, calculado a partir de tus series (fórmula de Epley). Sirve para comparar series con distinto peso y repeticiones.</p>';

/* ---------- dieta: cálculos ---------- */
const dayLog = d => { const l = state.log[d] || {}; MEALS.forEach(m => { if (!Array.isArray(l[m])) l[m] = []; }); return l; };
const sumItems = list => list.reduce((s,x) => ({kcal:s.kcal+(x.kcal||0), p:s.p+(x.p||0), c:s.c+(x.c||0), f:s.f+(x.f||0)}), {kcal:0,p:0,c:0,f:0});
const dayTotals = d => sumItems(MEALS.flatMap(m => (state.log[d] && state.log[d][m]) || []));
const mealNow = () => { const h = new Date().getHours(); return h < 11 ? "Desayuno" : h < 16 ? "Comida" : h < 19 ? "Merienda" : h < 23 ? "Cena" : "Snacks"; };
const portion = (f, g) => ({kcal:f.kcal*g/100, p:f.p*g/100, c:f.c*g/100, f:f.f*g/100});
const amountTxt = (x) => { const f = foodOf(x.food); if (f && f.u && f.ug && Math.abs(x.g/f.ug - Math.round(x.g/f.ug)) < .01) { const n = Math.round(x.g/f.ug); return n+" "+f.u+(n>1?(/[aeiouáéó]$/.test(f.u)?"s":"es"):"")+" · "+n0(x.g)+" g"; } return n0(x.g)+" g"; };

/* ---------- vista Dieta ---------- */
function renderDiet(){
  const d = dietDay, td = today(), dt = parse(d), log = dayLog(d), t = dayTotals(d), G = state.goals;

    right:'<div class="gtrio">'+ringHTML(pct===null?0:pct, '<b>'+n0(t.kcal)+'</b><small>kcal</small>', n0(t.kcal)+' kcal'+(goal?' de '+n0(goal):''), pct===100 && !over, from, over)
      +'<div class="mbars" role="img" aria-label="Proteína '+n0(t.p)+' g, hidratos '+n0(t.c)+' g, grasa '+n0(t.f)+' g">'+[["p","P","#8FA9E0"],["c","H","#E4CB94"],["f","G","#9FD3B4"]].map(([k,l,col]) => { const g = G[k]||0, r = g ? Math.min(1, t[k]/g) : (t[k] ? .5 : 0); return '<div class="mb'+(g && t[k] > g*1.1 ? ' over' : '')+'" style="--m:'+col+'"><small>'+l+'</small><span class="tr"><i style="height:'+(r*100)+'%"></i></span><b>'+n0(t[k])+'<span>g</span></b></div>'; }).join("")+'</div></div>'
  });
  h += exampleBanner();
  const mac = (k, label) => { const v = t[k], g = G[k]||0, r = g ? v/g : 0; return '<div class="mac'+(g && v > g*1.1 ? ' over' : '')+'" style="--m:'+MACRO_COL[k]+'"><small>'+label+'</small><b>'+n0(v)+'<span>'+(g?'/ '+n0(g)+' g':'g')+'</span></b><div class="meter"><i style="width:'+Math.min(100, r*100)+'%"></i></div></div>'; };
  h += '<div class="panel" style="margin-top:16px"><div class="macros">'+mac("p","Proteína")+mac("c","Hidratos")+mac("f","Grasa")+'</div></div>';
  MEALS.forEach(m => {
    const items = log[m], s = sumItems(items);
    h += '<div class="meal"><div class="meal-h"><span class="mi">'+SV(MEAL_ICO[m],1.9)+'</span><b>'+m+'</b><small>'+(items.length ? n0(s.kcal)+' kcal · '+n0(s.p)+' g prot.' : '')+'</small><button type="button" class="add" data-add="'+m+'" aria-label="Añadir a '+m+'">'+PLUS+'</button></div>'
      + items.map((x,i) => '<button type="button" class="fi" data-it="'+m+'|'+i+'"><span class="n"><b>'+esc(x.name)+'</b><small>'+amountTxt(x)+' · P '+n0(x.p)+' · H '+n0(x.c)+' · G '+n0(x.f)+'</small></span><span class="k">'+n0(x.kcal)+'</span></button>').join("")
      + (items.length ? '<div class="meal-f"><button class="linkbtn" type="button" data-savecombo="'+m+'">Guardar como comida</button>'+(d!==addDays(td,-1)||true?'<button class="linkbtn" type="button" data-copy="'+m+'">Copiar a otro día</button>':'')+'</div>' : (state.log[addDays(d,-1)] && (state.log[addDays(d,-1)][m]||[]).length ? '<div class="meal-f"><button class="linkbtn" type="button" data-yest="'+m+'">Repetir lo de ayer</button></div>' : ''))
      + '</div>';
  });
  /* semana */
  const days = []; for (let i=6;i>=0;i--) { const x = addDays(d,-i); days.push({d:x, k:dayTotals(x).kcal}); }
  const logged = days.filter(x => x.k > 0), avg = logged.length ? logged.reduce((s,x) => s+x.k, 0)/logged.length : 0;
  const W = 340, H = 160, L = 34, B = 22, T = 14, cw = (W-L)/7, bw = Math.min(26, cw*.56), ph = H-B-T, mx = niceMax(Math.max(goal, ...days.map(x => x.k)) * 1.05);
  let ch = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Calorías de los últimos 7 días">';
  [0,.5,1].forEach(f => { const y = T+ph*(1-f); ch += '<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+n0(mx*f)+'</text>'; });
  days.forEach((x,i) => { const hh = x.k/mx*ph, cx = L+cw*i+cw/2; if (hh) ch += '<rect class="bar'+(goal && x.k>goal*1.05?' over':'')+(x.d===d?' today':'')+'" x="'+(cx-bw/2)+'" y="'+(T+ph-hh)+'" width="'+bw+'" height="'+hh+'" rx="4"><title>'+shortDate(x.d)+': '+n0(x.k)+' kcal</title></rect>'; ch += '<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle"'+(x.d===d?' style="fill:var(--ink);font-weight:700"':'')+'>'+WD[wd(x.d)]+'</text>'; });

  ch += '</svg>';
  h += '<div class="section-t"><span>Últimos 7 días</span><small>'+(logged.length ? 'Media '+n0(avg)+' kcal' : 'Sin registros')+'</small></div><div class="panel">'+ch+(goal?'<div class="legend"><span><i style="background:var(--gold);border-radius:0;height:2px;width:14px"></i>Tu objetivo</span></div>':'')+'</div>';
  $view.innerHTML = h; bindExample(); animateRing(); heroPct = {day:"d"+d, v:pct||0};
  on("dPrev", () => { dietDay = addDays(dietDay,-1); render(); });
  on("dNext", () => { dietDay = addDays(dietDay,1); render(); });
  on("dNow", () => { dietDay = today(); render(); });
  $view.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => openAddFood(d, b.dataset.add)));
  $view.querySelectorAll("[data-it]").forEach(b => b.addEventListener("click", () => { const [m,i] = b.dataset.it.split("|"); openEntry(d, m, +i); }));
  $view.querySelectorAll("[data-savecombo]").forEach(b => b.addEventListener("click", () => openSaveCombo(log[b.dataset.savecombo], b.dataset.savecombo)));
  $view.querySelectorAll("[data-yest]").forEach(b => b.addEventListener("click", () => { const m = b.dataset.yest; const src = state.log[addDays(d,-1)][m]; state.log[d] = dayLog(d); state.log[d][m] = src.map(x => Object.assign({}, x, {id:uid()})); save(); render(); toast(m+" de ayer copiado"); }));
  $view.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => openCopy(d, b.dataset.copy)));
}

/* ---------- añadir alimento ---------- */
function openAddFood(d, meal){
  let q = "", tab = "rec";
  const recent = () => { const seen = new Set(), out = []; Object.keys(state.log).sort().reverse().forEach(k => MEALS.forEach(m => (state.log[k][m]||[]).forEach(x => { if (x.food && !seen.has(x.food) && foodOf(x.food)) { seen.add(x.food); out.push({f:foodOf(x.food), g:x.g}); } }))); return out.slice(0,25); };
  const draw = () => {
    let body = "";
    if (q || tab === "all") {
      const list = state.foods.filter(f => !q || norm(f.name).includes(norm(q))).sort((a,b) => a.name.localeCompare(b.name,"es"));
      body = list.length ? list.map(f => '<button type="button" class="fl" data-f="'+f.id+'"><span class="n"><b>'+esc(f.name)+'</b><small>'+f.cat+(f.u?' · 1 '+esc(f.u)+' = '+f.ug+' g':'')+'</small></span><span class="k">'+n0(f.kcal)+' kcal<br>P '+n1(f.p)+' / 100 g</span></button>').join("") : '<p class="hint">No encuentro «'+esc(q)+'». Puedes crearlo abajo.</p>';
    } else if (tab === "rec") {
      const r = recent();
      body = r.length ? r.map(z => '<button type="button" class="fl" data-f="'+z.f.id+'" data-g="'+z.g+'"><span class="n"><b>'+esc(z.f.name)+'</b><small>Última vez '+n0(z.g)+' g</small></span><span class="k">'+n0(z.f.kcal*z.g/100)+' kcal</span></button>').join("") : '<p class="hint">Aquí aparecerán los alimentos que uses. Busca uno arriba o mira la lista completa.</p>';
    } else {
      body = state.combos.length ? state.combos.map(c => { const s = sumItems(c.items); return '<button type="button" class="fl" data-combo="'+c.id+'"><span class="n"><b>'+esc(c.name)+'</b><small>'+c.items.map(x => esc(x.name)).join(", ")+'</small></span><span class="k">'+n0(s.kcal)+' kcal<br>P '+n0(s.p)+' g</span></button>'; }).join("") : '<p class="hint">Todavía no tienes comidas guardadas. En cada comida del día tienes «Guardar como comida».</p>';
    }
    document.getElementById("flist").innerHTML = body;
    document.querySelectorAll(".tabs2 button").forEach(b => b.setAttribute("aria-pressed", String(!q && b.dataset.t === tab)));
    document.getElementById("flist").querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => openAmount(d, meal, foodOf(b.dataset.f), b.dataset.g ? +b.dataset.g : null)));
    document.getElementById("flist").querySelectorAll("[data-combo]").forEach(b => b.addEventListener("click", () => {
      const c = state.combos.find(x => x.id === b.dataset.combo); state.log[d] = dayLog(d);
      c.items.forEach(x => state.log[d][meal].push(Object.assign({}, x, {id:uid()}))); save(); closeSheet(); render(); toast("«"+c.name+"» añadida a "+meal.toLowerCase());
    }));
  };
  $sheet.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sT"><div class="grab"></div><h2 id="sT">Añadir a '+meal.toLowerCase()+'</h2>'
    +'<div class="field" style="margin-bottom:6px"><label for="mealSel">Comida</label><select id="mealSel">'+MEALS.map(m => '<option'+(m===meal?' selected':'')+'>'+m+'</option>').join("")+'</select></div>'
    +'<input class="srch" type="search" id="fq" placeholder="Buscar alimento: pollo, arroz, yogur…" autocomplete="off" aria-label="Buscar alimento">'
    +'<div class="tabs2"><button type="button" data-t="rec">Recientes</button><button type="button" data-t="all">Todos</button><button type="button" data-t="combo">Mis comidas</button></div>'
    +'<div class="flist" id="flist"></div>'
    +'<div class="actions" style="margin-top:12px"><button class="btn" type="button" id="newFood">Crear alimento</button><button class="btn" type="button" id="newRecipe">Crear receta</button><button class="btn" type="button" id="quick">Solo calorías</button><span class="grow"></span><button class="btn" type="button" id="close">Cerrar</button></div></div></div>';
  document.getElementById("mealSel").addEventListener("change", e => { meal = e.target.value; document.getElementById("sT").textContent = "Añadir a "+meal.toLowerCase(); });
  document.getElementById("fq").addEventListener("input", e => { q = e.target.value; draw(); });
  document.querySelectorAll(".tabs2 button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.t; q = ""; document.getElementById("fq").value = ""; draw(); }));
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  on("close", closeSheet);
  on("newFood", () => openFood(null, document.getElementById("fq").value, f => openAmount(d, meal, f), () => openAddFood(d, meal)));
  on("newRecipe", () => openRecipe(null, f => openAmount(d, meal, f), () => openAddFood(d, meal)));
  on("quick", () => openQuick(d, meal));
  if (!recent().length) tab = "all";
  draw();
}
function openAmount(d, meal, f, g0, editIdx){
  const hasU = f.u && f.ug;
  let g = g0 || (hasU ? f.ug : 100);
  const draw = () => {
    const p = portion(f, g);
    document.getElementById("prev").innerHTML = '<div><b>'+n0(p.kcal)+'</b><small>kcal</small></div><div><b>'+n1(p.p)+'</b><small>Prot.</small></div><div><b>'+n1(p.c)+'</b><small>Hidr.</small></div><div><b>'+n1(p.f)+'</b><small>Grasa</small></div>';
  };
  const editing = editIdx !== undefined;
  $sheet.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sT" novalidate><div class="grab"></div><h2 id="sT">'+esc(f.name)+'</h2>'
    +'<label class="amt" for="grams"><input id="grams" inputmode="decimal" autocomplete="off" value="'+n1(g).replace(/\./g,"")+'" aria-label="Cantidad en gramos"><span>g</span></label>'
    +'<div class="qbtns">'+(hasU ? [1,2,3].map(n => '<button type="button" data-q="'+(f.ug*n)+'">'+n+' '+esc(f.u)+(n>1?(/[aeiouáéó]$/.test(f.u)?"s":"es"):"")+'</button>').join("") : '')+[50,100,150,200].map(v => '<button type="button" data-q="'+v+'">'+v+' g</button>').join("")+'</div>'
    +'<div class="preview" id="prev"></div>'
    +'<p class="hint" style="margin:-6px 0 12px">Por 100 g: '+n0(f.kcal)+' kcal · P '+n1(f.p)+' · H '+n1(f.c)+' · G '+n1(f.f)+'. Valores aproximados.</p>'
    +'<div class="actions">'+(editing?'<button class="btn danger" type="button" id="del">Quitar</button>':'<button class="btn" type="button" id="back">Volver</button>')+'<span class="grow"></span><button class="btn primary" type="submit">'+(editing?'Guardar':'Añadir')+'</button></div></form></div>';
  const inp = document.getElementById("grams");

  inp.addEventListener("input", () => { g = num(inp.value); draw(); });
  document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { g = +b.dataset.q; inp.value = n1(g).replace(/\./g,""); draw(); }));
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  on("back", () => openAddFood(d, meal));
  on("del", () => { const l = dayLog(d), x = l[meal].splice(editIdx,1)[0]; state.log[d] = l; save(); closeSheet(); render(); toast(x.name+" quitado", {label:"Deshacer", fn:() => { l[meal].splice(editIdx,0,x); save(); render(); }}); });
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    if (!(g > 0)) { toast("Escribe una cantidad mayor que cero"); inp.focus(); return; }
    const entry = Object.assign({id:uid(), food:f.id, name:f.name, g}, portion(f, g));
    const l = dayLog(d); state.log[d] = l;
    if (editing) l[meal][editIdx] = entry; else l[meal].push(entry);
    save(); closeSheet(); render(); buzz(15); toast(editing ? "Cantidad guardada" : f.name+" añadido · "+n0(entry.kcal)+" kcal");
  });
  draw();
}
function openEntry(d, meal, i){

function openFood(f, name, onDone, onBack){

    +'<div class="field"><label for="fn">Nombre</label><input type="text" id="fn" maxlength="40" value="'+esc(v.name)+'" placeholder="Barrita de proteína" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px"></div>'

function openRecipe(f, onDone, onBack){
  const editing = !!(f && f.recipe);
  const R_ = editing ? {name:f.name, servings:f.recipe.servings, items:f.recipe.items.map(x => Object.assign({}, x))} : {name:"", servings:2, items:[]};
  let q = "";
  const totals = () => { let g = 0, t = {kcal:0,p:0,c:0,f:0}; R_.items.forEach(x => { const fd = foodOf(x.food); if (!fd) return; g += x.g; const p = portion(fd, x.g); t.kcal += p.kcal; t.p += p.p; t.c += p.c; t.f += p.f; }); return {g, t}; };
  const drawRes = () => {
    const el = document.getElementById("rres"); if (!el) return;
    if (!q) { el.innerHTML = ""; return; }
    const list = state.foods.filter(x => !x.recipe && norm(x.name).includes(norm(q))).slice(0,8);
    el.innerHTML = list.map(x => '<button type="button" class="fl" data-ri="'+x.id+'"><span class="n"><b>'+esc(x.name)+'</b><small>'+n0(x.kcal)+' kcal / 100 g</small></span><span class="k">+ Añadir</span></button>').join("") || '<p class="hint">Sin resultados.</p>';
    el.querySelectorAll("[data-ri]").forEach(b => b.addEventListener("click", () => { const fd = foodOf(b.dataset.ri); R_.items.push({food:fd.id, name:fd.name, g:fd.ug || 100}); q = ""; draw(); }));
  };
  const draw = () => {
    const {g, t} = totals(), sv = Math.max(1, R_.servings);
    $sheet.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sT" novalidate><div class="grab"></div><h2 id="sT">'+(editing?'Editar receta':'Nueva receta')+'</h2>'
      +'<div class="field"><label for="rn">Nombre</label><input type="text" id="rn" maxlength="40" value="'+esc(R_.name)+'" placeholder="Lentejas de mamá" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px"></div>'
      +'<div class="field"><span class="lbl">Raciones que salen</span><div class="stepper"><button type="button" id="sMinus" aria-label="Menos">−</button><b>'+sv+'</b><button type="button" id="sPlus" aria-label="Más">+</button><span>'+(sv===1?'ración':'raciones')+'</span></div></div>'
      +'<div class="field"><span class="lbl">Ingredientes de toda la receta</span>'
      +(R_.items.length ? '<div class="panel" style="padding:8px 12px">'+R_.items.map((x,i) => '<div class="ing"><span class="n">'+esc(x.name)+'<small>'+n0(foodOf(x.food) ? portion(foodOf(x.food), x.g).kcal : 0)+' kcal</small></span><input type="number" inputmode="decimal" data-ig="'+i+'" value="'+x.g+'" aria-label="Gramos de '+esc(x.name)+'"><span style="font-family:var(--f-ui);font-size:13px;color:var(--muted)">g</span><button type="button" class="x" data-irm="'+i+'" aria-label="Quitar">×</button></div>').join("")+'</div>' : '<p class="hint" style="margin:0">Busca abajo para añadir ingredientes.</p>')
      +'<input class="srch" type="search" id="rq" placeholder="Añadir ingrediente: lentejas, chorizo…" autocomplete="off" value="'+esc(q)+'" style="margin-top:8px" aria-label="Buscar ingrediente"><div class="flist" id="rres" style="max-height:220px"></div></div>'
      +'<div class="preview"><div><b>'+n0(t.kcal/sv)+'</b><small>kcal</small></div><div><b>'+n1(t.p/sv)+'</b><small>Prot.</small></div><div><b>'+n1(t.c/sv)+'</b><small>Hidr.</small></div><div><b>'+n1(t.f/sv)+'</b><small>Grasa</small></div></div>'
      +'<p class="hint" style="margin:-6px 0 12px">Por ración ('+n0(g/sv)+' g de ingredientes). Total de la receta: '+n0(t.kcal)+' kcal.</p>'
      +'<div class="actions">'+(editing?'<button class="btn danger" type="button" id="del">Borrar</button>':'')+'<button class="btn" type="button" id="back">Volver</button><span class="grow"></span><button class="btn primary" type="submit">Guardar receta</button></div></form></div>';
    const rn = document.getElementById("rn"); rn.addEventListener("input", () => { R_.name = rn.value; });
    document.querySelectorAll("[data-ig]").forEach(i => i.addEventListener("change", () => { R_.items[+i.dataset.ig].g = Math.max(0, num(i.value)); draw(); }));
    document.querySelectorAll("[data-irm]").forEach(b => b.addEventListener("click", () => { R_.items.splice(+b.dataset.irm,1); draw(); }));
    on("sMinus", () => { R_.servings = Math.max(1, R_.servings-1); draw(); });
    on("sPlus", () => { R_.servings = Math.min(30, R_.servings+1); draw(); });
    const rq = document.getElementById("rq"); rq.addEventListener("input", () => { q = rq.value; drawRes(); });
    if (q) { rq.focus(); drawRes(); }
    on("back", () => onBack ? onBack() : closeSheet());
    on("del", () => { const idx = state.foods.indexOf(f); state.foods.splice(idx,1); save(); closeSheet(); render(); toast("Receta borrada", {label:"Deshacer", fn:() => { state.foods.splice(idx,0,f); save(); render(); }}); });
    document.getElementById("form").addEventListener("submit", e => {
      e.preventDefault();
      const name = R_.name.trim(); if (!name) { toast("Ponle un nombre a la receta"); rn.focus(); return; }
      if (!R_.items.length || g <= 0) { toast("Añade al menos un ingrediente"); return; }
      const data = {name, cat:"Recetas", kcal:t.kcal/g*100, p:t.p/g*100, c:t.c/g*100, f:t.f/g*100, u:"ración", ug:Math.round(g/sv), recipe:{servings:sv, items:R_.items}};
      let food; if (editing) { Object.assign(f, data); food = f; } else { food = Object.assign({id:uid(), custom:true}, data); state.foods.push(food); }
      save(); buzz(15); toast(editing ? "Receta guardada" : "Receta creada: "+n0(t.kcal/sv)+" kcal por ración");
      if (onDone) onDone(food); else { closeSheet(); render(); }
    });
  };
  draw();
}
function openSaveCombo(items, meal){
  $sheet.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sT" novalidate><div class="grab"></div><h2 id="sT">Guardar como comida</h2>'
    +'<p class="hint" style="margin:-8px 0 12px">'+items.map(x => esc(x.name)).join(", ")+' · '+n0(sumItems(items).kcal)+' kcal</p>'
    +'<div class="field"><label for="cn">Nombre</label><input type="text" id="cn" maxlength="40" placeholder="Mi '+meal.toLowerCase()+' habitual" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px"></div>'
    +'<div class="actions"><span class="grow"></span><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form></div>';
  setTimeout(() => document.getElementById("cn").focus(), 60);
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  on("cancel", closeSheet);
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const n = document.getElementById("cn").value.trim() || "Mi "+meal.toLowerCase()+" habitual";
    state.combos.push({id:uid(), name:n, items:items.map(x => Object.assign({}, x))}); save(); closeSheet(); render(); toast("Guardada en «Mis comidas»");
  });
}
function openCopy(d, meal){
  $sheet.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sT" novalidate><div class="grab"></div><h2 id="sT">Copiar '+meal.toLowerCase()+'</h2>'
    +'<div class="grid2"><div class="field"><label for="cd">Al día</label><input type="date" id="cd" value="'+addDays(d,1)+'"></div><div class="field"><label for="cm">En</label><select id="cm">'+MEALS.map(m => '<option'+(m===meal?' selected':'')+'>'+m+'</option>').join("")+'</select></div></div>'
    +'<div class="actions"><span class="grow"></span><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary" type="submit">Copiar</button></div></form></div>';
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  on("cancel", closeSheet);
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const to = document.getElementById("cd").value, m2 = document.getElementById("cm").value; if (!to) return;
    const l = dayLog(to); state.log[to] = l; dayLog(d)[meal].forEach(x => l[m2].push(Object.assign({}, x, {id:uid()})));
    save(); closeSheet(); render(); toast("Copiado al "+shortDate(to));
  });
}

    +'<div class="card"><h2>Alimentos</h2><p>'+state.foods.length+' alimentos. Los valores de la lista base son aproximados: puedes corregirlos con los de tus etiquetas.</p>'

  const drawFoods = () => {

  on("restore", () => restore(document.getElementById("importBox").value));
  on("wipe", () => { confirmWipe = true; render(); });

}
function restore(txt){
  try {
    const d = JSON.parse(txt);
    if (!d || d.app !== "gym-dieta" || !d.data || !Array.isArray(d.data.workouts)) throw 0;
    state = d.data; save(); render(); toast("Copia restaurada");
  } catch(e) { toast("Ese archivo no es una copia válida de Gym y Dieta"); }
}

/* ---------- utilidades de interfaz ---------- */
const $sheet = document.getElementById("sheetRoot");
function closeSheet(){ $sheet.innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $sheet.innerHTML) closeSheet(); });
let toastTimer;
function toast(msg, action){
  const root = document.getElementById("toastRoot"); clearTimeout(toastTimer);
  root.innerHTML = '<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(action?'<button type="button" id="tAct">'+esc(action.label)+'</button>':'')+'</div>';
  if (action) document.getElementById("tAct").addEventListener("click", () => { root.innerHTML = ""; action.fn(); });
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, action ? 5000 : 3500);
}
const buzz = pat => { if (state.vibrate === false) return; try { if (navigator.vibrate) navigator.vibrate(pat); } catch(e) {} };
const FX = {parts:[], on:false};
const reduced = () => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) { return false; } };
function fxRun(){
  if (FX.on) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio||1, 2), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); cv.hidden = false; FX.on = true;
  (function frame(){
    ctx.clearRect(0,0,W,H);
    FX.parts = FX.parts.filter(p => p.life > 0);
    for (const p of FX.parts){ p.vx *= .985; p.vy = p.vy*.985 + p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay; if (p.life <= 0) continue; ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (FX.parts.length) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; FX.on = false; }
  })();
}
function burst(x, y, cols, n, speed, size, decay, g){
  for (let i=0;i<n;i++){ const a = (Math.PI*2*i)/n + Math.random()*.25, sp = speed*(.6 + Math.random()*.8); FX.parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, decay, g, c:cols[i % cols.length], r:size*(.7+Math.random()*.6)}); }

}
function sparkle(el, color, n){ if (reduced() || !el) return; const b = el.getBoundingClientRect(); burst(b.left + b.width/2, b.top + b.height/2, [color, "#D2B67E", "#F4E2B4", "#3E7C5F"], n || 14, 2.4, 2, .03, .03); }

  [[.3,.28,0],[.7,.22,280],[.5,.36,560],[.22,.42,860],[.78,.4,1050]].forEach(([fx,fy,t]) => setTimeout(() => { const a = cols[Math.floor(Math.random()*cols.length)], b = cols[Math.floor(Math.random()*cols.length)]; burst(W*fx, H*fy, [a,a,b], 46, 3.5, 2.6, .012, .05); }, t));
}
